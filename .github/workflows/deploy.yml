name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The measured checks, before the build rather than after it. Both are
      # pure functions over committed values with no browser and no network, so
      # they run in about a second and fail the deploy instead of shipping a
      # plate whose type is under the contrast floor.
      - run: npm run verify

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: adityagaur-xyz
          directory: out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
